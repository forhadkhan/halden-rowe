# Deploy to GitHub Pages. Runs on every push to main, and can be started by hand (Actions > Deploy to GitHub
# Pages > Run workflow).
# Repo settings: Pages > Source = GitHub Actions. Repository variables (Settings > Secrets and variables >
# Actions > Variables): SITE_URL (the build fails without a site URL; see the Build step), BASE_PATH,
# PUBLIC_FORM_ENDPOINT, PUBLIC_FORM_ACCESS_KEY (a public, domain-locked key).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Astro's processed images and fonts. Files are named by a hash of the source and the size/format, so a
      # restored cache is always safe: unchanged photos are reused, new or edited ones are rebuilt. The key changes
      # when a photo does; restore-keys starts from the latest older cache. Most of the build time is image work.
      - uses: actions/cache@v4
        with:
          path: |
            node_modules/.astro/assets
            node_modules/.astro/fonts
          key: astro-cache-${{ hashFiles('src/assets/**', 'public/**', 'astro.config.*') }}
          restore-keys: astro-cache-

      - name: Build
        env:
          # SITE_URL is required by `astro build` (canonical, Open Graph and sitemap URLs). Set the repository
          # variable SITE_URL to the public origin, e.g. https://www.example.com for a custom domain (with
          # BASE_PATH=/). Unset, it defaults to this repo's project site, https://<owner>.github.io/<repo>/.
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}', github.event.repository.name) }}
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
          PUBLIC_FORM_ACCESS_KEY: ${{ vars.PUBLIC_FORM_ACCESS_KEY }}
        run: npm run check && npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
